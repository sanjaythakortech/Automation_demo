<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generated</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <div class="topbar">
            <form method="post" action="{{ url_for('logout') }}">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
        <section class="card success">

            <h1>Documents Generated</h1>

            <p>Saved in your Documents folder:</p>
            <p><strong>{{ saved_dir }}</strong></p>
            <button type="button" onclick="fetch('{{ url_for('open_folder', folder=folder_name) }}', {method: 'POST'})">Open Folder</button>

            <h2>Generated Files</h2>

            <div class="pdf-list">
                {% for f in files %}
                <div class="pdf-item">
                    <span>{{ f }}</span>
                    <a class="download"
                        href="{{ url_for('download', folder=folder_name, filename=f) }}">
                        Download
                    </a>
                </div>
                {% endfor %}
                <div class="pdf-item">
                    <span>Generated_Documents.zip</span>
                    <a class="download"
                        href="{{ url_for('download', folder=folder_name, filename='Generated_Documents.zip') }}">
                        Download ZIP
                    </a>
                </div>
            </div>

            <a class="generate-again" href="{{ url_for('index') }}">
                Generate another pack
            </a>

        </section>
    </div>
</body>

</html>
