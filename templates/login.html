<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Document Automation</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f8fb;font-family:Arial,sans-serif;color:#243447;padding:20px}.login-card{width:100%;max-width:420px;background:#fff;border-radius:14px;padding:32px;box-shadow:0 10px 35px rgba(0,0,0,.10)}h1{margin:0 0 8px;font-size:28px}p{margin:0 0 24px;color:#667085}label{display:block;font-weight:600;margin:16px 0 7px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:8px;font-size:15px;box-sizing:border-box}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#0b2545;color:#fff;font-size:16px;font-weight:700}.error{background:#fff1f0;color:#b42318;border:1px solid #fecdca;padding:10px 12px;border-radius:8px;margin-bottom:14px}</style></head><body><div class="login-card"><h1>Document Automation</h1><p>Please login to continue.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Login</button></form></div></body></html>
